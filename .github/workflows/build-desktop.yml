# build-desktop.yml — Pipeline de build desktop (installeur Windows NSIS)
#
# Comble la référence orpheline relevée par l'audit prod-readiness-audit
# (groupe A) : scripts/build-tauri-prep.sh l.3 cite ce workflow.
#
# Contrats réels utilisés (vérifiés par le cycle build-desktop-pipeline) :
#   - tauri.conf.json l.8 : beforeBuildCommand = "bash scripts/build-tauri-prep.sh"
#     (produit build/tauri-bundle/standalone.zip + node.exe, ressources l.42-46)
#   - next.config.ts l.4 : output: "standalone"
#   - Framework Tauri v2 (Cargo.toml) ; version produit 1.10.7 (tauri.conf.json l.4)
#
# Secret runtime : depuis T14 (C-D2 option a), AUCUNE clé API n'est embarquée au
# build — OPENALEX_API_KEY est fournie par l'environnement de la machine
# utilisateur (voir .env.example et docs/EXPLOITATION-SERVEUR.md §3).

name: build-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install
        shell: bash

      - name: "Garde-fou : bases synchronisées avec prisma/schema.prisma (lecture seule)"
        shell: bash
        run: |
          set -e
          # Comportement prouvé localement (cycle build-desktop-pipeline, T3) :
          #   exit 0 = base synchrone ; exit 2 = drift détecté. Toute valeur
          #   non nulle échoue ce step (set -e) AVANT tout build coûteux, pour
          #   ne jamais distribuer un installeur avec une base désynchronisée
          #   (défaut exact constaté sur urbanisme-test.db lors de l'audit).
          bunx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-url file:db/custom.db --exit-code
          echo "custom.db : synchrone avec le schéma."
          bunx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-url file:db/urbanisme-test.db --exit-code
          echo "urbanisme-test.db : synchrone avec le schéma."

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build Tauri (NSIS) + release draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: bunx tauri
          tagName: v__VERSION__
          releaseName: "Ma Thèse v__VERSION__"
          releaseBody: "Installeur Windows (NSIS). Les ressources (serveur embarqué, base) sont packagées dans l'installeur."
          releaseDraft: true
          args: --target x86_64-pc-windows-msvc

      - name: Upload artefact (installeur NSIS)
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
