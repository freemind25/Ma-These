name: Build Desktop (Windows)

on:
  push:
    tags:
      - 'v*'

# Un seul build à la fois — pas de concurrence sur les tags
concurrency:
  group: tauri-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri:
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 45

    steps:
      # --- Checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Toolchain ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # --- Cache Rust (accélère les builds suivants) ---
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # --- Cache Bun (node_modules) ---
      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb') }}
          restore-keys: ${{ runner.os }}-bun-

      # --- Install frontend deps ---
      - name: Install dependencies
        run: bun install

      # --- Build Tauri app ---
      # tauri-action exécute beforeBuildCommand (dans tauri.conf.json)
      # puis compile le binaire Rust, puis crée les installateurs NSIS + MSI
      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ma Thèse ${{ github.ref_name }}'
          releaseBody: |
            ## Ma Thèse ${{ github.ref_name }}

            Assistant intelligent pour la rédaction de thèses de doctorat.

            ### Installation
            1. Télécharger le fichier `.exe` (NSIS) ou `.msi`
            2. Lancer l'installateur
            3. Au premier lancement, Windows affiche « Éditeur inconnu » → cliquer « Plus d'infos » puis « Exécuter quand même »
            4. Configurer votre clé IA dans Paramètres

            > L'application démarre un serveur local (port 14325). Aucune donnée ne quitte votre machine sauf les appels IA que vous autorisez.
          releaseDraft: true
          prerelease: false
