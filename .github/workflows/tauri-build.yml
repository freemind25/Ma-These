name: Build Tauri Windows Installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to upload assets to (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

env:
  APP_NAME: ThesisFrame
  APP_VERSION: '1.3.0'

jobs:
  build-windows:
    name: Build Windows NSIS installer
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        shell: bash
        run: |
          powershell -c "irm bun.sh/install.ps1 | iex"
          echo "$USERPROFILE\\.bun\\bin" >> $GITHUB_PATH

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          key: tauri-${{ env.APP_VERSION }}

      - name: Install NSIS
        shell: pwsh
        run: |
          Write-Host "Installing NSIS via chocolatey..."
          choco install nsis -y --no-progress
          Write-Host "NSIS version:"
          makensis /VERSION
          Get-Command makensis | Select-Object Source

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          Write-Host "Downloading WebView2 SDK..."
          $downloadUrl = "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2903.40"
          $outputZip = "$env:TEMP\webview2-sdk.zip"
          $extractDir = "$env:TEMP\webview2-sdk"

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Invoke-WebRequest -Uri $downloadUrl -OutFile $outputZip
          Expand-Archive -Path $outputZip -DestinationPath $extractDir -Force

          Write-Host "WebView2 SDK extracted to: $extractDir\build\native"
          echo "WEBVIEW2_SDK_PATH=$extractDir\build\native" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        shell: bash
        run: bun install --frozen-lockfile || bun install

      - name: Build Next.js standalone server
        shell: bash
        run: bun run build

      - name: Prepare server bundle for Tauri
        shell: bash
        run: |
          set -e
          echo "=== Preparing ThesisFrame server bundle ==="

          mkdir -p src-tauri/standalone
          cp -r .next/standalone/* src-tauri/standalone/

          mkdir -p src-tauri/standalone/.next/static
          cp -r .next/static/* src-tauri/standalone/.next/static/

          if [ -d "public" ]; then
            mkdir -p src-tauri/standalone/public
            cp -r public/* src-tauri/standalone/public/ 2>/dev/null || true
          fi

          mkdir -p src-tauri/standalone/prisma
          cp prisma/schema.prisma src-tauri/standalone/prisma/

          cd src-tauri/standalone
          bun install --production --ignore-scripts
          cd "$GITHUB_WORKSPACE"

          NODE_PATH="$(which node 2>/dev/null || which node.exe 2>/dev/null)"
          echo "Node.js path: $NODE_PATH"
          if [ -f "$NODE_PATH" ]; then
            cp "$NODE_PATH" src-tauri/node.exe
            echo "Copied node.exe to src-tauri/"
            ls -la src-tauri/node.exe
          else
            echo "ERROR: node.exe not found!"
            exit 1
          fi

          if [ -f "src-tauri/standalone/server.js" ]; then
            echo "OK: server.js found in standalone bundle"
          else
            echo "ERROR: server.js NOT found"
            ls -la src-tauri/standalone/
            exit 1
          fi

          echo "=== Bundle prepared ==="

      - name: Update tauri.conf.json for build
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          cfg.bundle.targets = ['nsis'];
          cfg.bundle.resources = {
            '../db/*': 'db/',
            'standalone/**/*': 'standalone/',
            'node.exe': ''
          };
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2));
          console.log('Updated tauri.conf.json bundle:');
          console.log(JSON.stringify(cfg.bundle, null, 2));
          "

      - name: Build Tauri app (NSIS)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "=== Tauri build starting ==="
          echo "CWD: $(pwd)"
          echo "Rust version:"
          rustc --version
          echo "Cargo version:"
          cargo --version
          echo "Node version:"
          node --version
          echo "Tauri config:"
          cat src-tauri/tauri.conf.json
          echo "=== Building ==="
          npx @tauri-apps/cli build --verbose
          echo "=== Build finished ==="

      - name: List build outputs
        shell: bash
        run: |
          echo "=== NSIS bundle ==="
          find src-tauri/target/release/bundle/nsis/ -type f 2>/dev/null || echo "NSIS dir not found"
          echo "=== Release exe ==="
          find src-tauri/target/release/ -maxdepth 1 -name "*.exe" -type f 2>/dev/null || echo "No exe"

      - name: Upload NSIS installer to release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXE_FILE=$(find src-tauri/target/release/bundle/nsis/ -name "*.exe" -type f 2>/dev/null | head -1)
          if [ -n "$EXE_FILE" ]; then
            echo "Uploading: $EXE_FILE"
            ls -la "$EXE_FILE"
            gh release upload "${{ github.event.inputs.release_tag }}" "$EXE_FILE" --clobber
            echo "Upload successful!"
          else
            echo "No NSIS .exe found to upload"
            exit 1
          fi

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ env.APP_VERSION }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn
          retention-days: 7
