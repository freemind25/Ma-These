[package]
name = "mathese"
version = "1.4.0"
description = "Ma Thèse — Assistant intelligent pour la rédaction de thèses de doctorat"
authors = ["freemind25"]
edition = "2021"

[lib]
name = "mathese_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
