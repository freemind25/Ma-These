# ============================================================================
# ThesisFrame — electron-builder Configuration
# Packages the Next.js standalone app into desktop installers
# Windows (.exe NSIS), macOS (.dmg), Linux (.AppImage)
# ============================================================================

appId: com.thesisframe.app
productName: ThesisFrame
copyright: Copyright © 2025 ThesisFrame

directories:
  output: release

files:
  - .next/standalone/**/*
  - .next/static/**/*
  - public/**/*
  - electron/**/*
  - db/**/*
  - node_modules/.prisma/**/*
  - node_modules/@prisma/**/*
  - node_modules/prisma/**/*
  - prisma/schema.prisma

extraResources:
  - from: db/custom.db
    to: db/custom.db

extraMetadata:
  version: "1.1.0"

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: public/icon.png
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/icon.png
  uninstallerIcon: public/icon.png
  installerHeaderIcon: public/icon.png
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ThesisFrame

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: public/icon.png
  artifactName: ${productName}-${version}-mac.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: public/icon.png
  category: Office
  artifactName: ${productName}-${version}-linux.${ext}

publish:
  provider: github
  owner: freemind25
  repo: Ma-These
