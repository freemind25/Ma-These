# ============================================================================
# ThesisFrame — electron-builder Configuration
# This file contains the electron-builder configuration for packaging
# the Next.js standalone app into a desktop application.
# ============================================================================

appId: com.thesisframe.app
productName: ThesisFrame
copyright: Copyright © 2025 ThesisFrame

directories:
  output: release

# Files to include in the packaged app
files:
  - .next/standalone/**/*
  - .next/static/**/*
  - public/**/*
  - electron/**/*
  - db/**/*
  - node_modules/.prisma/**/*
  - node_modules/@prisma/**/*
  - node_modules/prisma/**/*
  - prisma/schema.prisma

# Extra resources to copy alongside the app
extraResources:
  - from: db/custom.db
    to: db/custom.db

extraMetadata:
  version: "1.0.0"

# Windows-specific configuration
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: public/logo.svg
  artifactName: ${productName}-${version}-setup.${ext}

# NSIS installer configuration
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: public/logo.svg
  uninstallerIcon: public/logo.svg
  installerHeaderIcon: public/logo.svg
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ThesisFrame

# macOS-specific configuration
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.productivity
  icon: public/logo.svg
  artifactName: ${productName}-${version}-mac.${ext}

# Linux-specific configuration
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  icon: public/logo.svg
  category: Office
  artifactName: ${productName}-${version}-linux.${ext}

# Auto-update configuration via GitHub Releases
publish:
  provider: github
  owner: freemind25
  repo: MaTh-se
