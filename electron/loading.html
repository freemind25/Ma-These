<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThesisFrame — Démarrage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #0a0a0a;
      color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .container {
      text-align: center;
      animation: fadeIn 0.6s ease-out;
    }

    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      filter: brightness(0) invert(1);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .app-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fafafa 0%, #a1a1aa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 14px;
      color: #71717a;
      margin-bottom: 40px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #27272a;
      border-top: 3px solid #fafafa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    .status {
      font-size: 13px;
      color: #a1a1aa;
      transition: color 0.3s;
    }

    .status.error {
      color: #ef4444;
    }

    .dots::after {
      content: '';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    .footer {
      position: fixed;
      bottom: 24px;
      font-size: 11px;
      color: #52525b;
    }

    /* Dark mode — already dark by default */
    @media (prefers-color-scheme: light) {
      body {
        background: #fafafa;
        color: #0a0a0a;
      }
      .logo {
        filter: none;
      }
      .app-name {
        background: linear-gradient(135deg, #0a0a0a 0%, #52525b 100%);
        -webkit-background-clip: text;
        background-clip: text;
      }
      .tagline {
        color: #71717a;
      }
      .spinner {
        border-color: #e4e4e7;
        border-top-color: #0a0a0a;
      }
      .status {
        color: #52525b;
      }
      .footer {
        color: #a1a1aa;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Inline ThesisFrame logo (Z-lettermark) -->
    <svg class="logo" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
      <rect x="1.49" y="1.49" width="27.03" height="27.03" rx="4" ry="4" fill="#27272a" stroke="#3f3f46" stroke-width="0.63"/>
      <g>
        <path d="M15.47,7.1l-1.3,1.85c-0.2,0.29-0.54,0.47-0.9,0.47h-7.1V7.09C6.16,7.1,15.47,7.1,15.47,7.1z" fill="#fafafa"/>
        <polygon points="24.3,7.1 13.14,22.91 5.7,22.91 16.86,7.1" fill="#fafafa"/>
        <path d="M14.53,22.91l1.31-1.86c0.2-0.29,0.54-0.47,0.9-0.47h7.09v2.33H14.53z" fill="#fafafa"/>
      </g>
    </svg>

    <div class="app-name">ThesisFrame</div>
    <div class="tagline">Assistant intelligent pour la rédaction de thèses</div>

    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Démarrage du serveur<span class="dots"></span></div>
  </div>

  <div class="footer">v1.0.0</div>

  <script>
    // Listen for server error events from the main process
    if (window.electronAPI) {
      window.electronAPI.onServerError(function(message) {
        var spinner = document.getElementById('spinner');
        var status = document.getElementById('status');
        spinner.style.display = 'none';
        status.className = 'status error';
        status.textContent = 'Erreur : ' + message;
      });
    }
  </script>
</body>
</html>
